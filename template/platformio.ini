[platformio]
default_envs = esp32dev, esp32s3nano

[env:base]
platform = espressif32
framework = arduino, espidf
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_STACK_SIZE=4096
    -DAPP_FOUNDATION_VERSION=\"0.1.0\"
    -std=gnu++17
    -I ../include
build_unflags = -std=gnu++11
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_extra_dirs = 
    ../modules
    ../lib
lib_deps =
    application
    configManager
    dataManager
    eventBus
    keyManager
    mcpServer
    otaUpdateManager
    timeManager
    webServer
    wifiManager
    u8g2Display
    deviceCrypto
    githubClient
    logger
    md5Utils
    bblanchon/ArduinoJson@7.4.3
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    olikraus/U8g2@2.36.18

[env:esp32dev]
extends = env:base
board = esp32dev
board_build.partitions = ../partitions.esp32dev.csv
board_build.filesystem = littlefs
custom_sdkconfig = ../sdkconfig.defaults

[env:esp32s3nano]
extends = env:base
board = um_nanos3
board_build.partitions = ../partitions.esp32s3nano.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
custom_sdkconfig = ../sdkconfig.defaults.esp32s3nano
build_flags =
    ${env:base.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

[env:native]
platform = native
build_flags =
    -std=c++17
    -DNATIVE_BUILD
    -DUNIT_TEST
lib_deps =
    symlink://../
    google/googletest@^1.15.2
    bblanchon/ArduinoJson@7.4.3
test_framework = googletest
