; ESP32 App Foundation — App Template
;
; Minimal build configuration for the skeleton template.
; Demonstrates framework integration without weather-specific dependencies.
;
; For the full sample app with display, streaming JSON, and weather data,
; see ../sample-app/platformio.ini.

[platformio]
default_envs = esp32dev, esp32s3nano

[env:base]
platform = espressif32
framework = arduino, espidf
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_STACK_SIZE=4096
    -DAPP_TITLE=\"ESP32\ App\ Foundation\"
    -DSECURITY_VERSION=1
    -std=gnu++17
    -I ../include
build_unflags = -std=gnu++11
lib_ldf_mode = deep+
; NOTE: lib_compat_mode is set to 'off' to allow transitive include resolution.
; The framework's U8G2Display module uses SPI.h without declaring SPI as a
; dependency in its library.json. With 'strict' mode, the SPI include path
; is not added to U8G2Display's compilation, causing a build failure.
lib_compat_mode = off
extra_scripts =
    pre:../scripts/sync_sdkconfig.py
    pre:../scripts/inject_version.py
    pre:../scripts/merge_framework_data.py
    pre:../scripts/portalBuilder.py
lib_extra_dirs = 
    ../modules
    ../lib
lib_deps =
    Application
    bblanchon/ArduinoJson@7.4.3
    hoeken/PsychicHttp@3.0.0
    olikraus/U8g2@2.36.18
    SPI

[env:esp32dev]
extends = env:base
board = esp32dev
board_build.partitions = ../partitions.esp32dev.csv
board_build.filesystem = littlefs
custom_sdkconfig = sdkconfig.defaults
upload_speed = 460800
build_flags =
    ${env:base.build_flags}
    -DBOARD_ID=\"esp32dev\"
    ; Define SPI pins (ESP32 VSPI defaults) so the framework's U8G2DisplayModule
    ; includes SPI.h — required because the #include is guarded by these defines
    ; but SPI.begin() is called unconditionally on non-NATIVE_BUILD targets.
    -DDISPLAY_SPI_SCK=18
    -DDISPLAY_SPI_MISO=19
    -DDISPLAY_SPI_MOSI=23

[env:esp32s3nano]
extends = env:base
board = um_nanos3
board_build.partitions = ../partitions.esp32s3nano.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3nano"
build_flags =
    ${env:base.build_flags}
    -DBOARD_ID=\"esp32s3nano\"
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DU8G2_DISPLAY_TYPE=U8G2_SSD1322_NHD_256X64_F_4W_HW_SPI
    -DU8G2_WITHOUT_FONT_ROTATION
    -DU8G2_WITHOUT_UNICODE
    -DDISPLAY_CS_PIN=10
    -DDISPLAY_DC_PIN=9
    -DDISPLAY_SPI_SCK=48
    -DDISPLAY_SPI_MISO=47
    -DDISPLAY_SPI_MOSI=38

[env:native]
platform = native
lib_compat_mode = off
lib_ldf_mode = deep+
build_flags =
    -std=c++17
    -DNATIVE_BUILD
    -DUNIT_TEST
    -I ../include
    -I ../
    -DBUILD_VERSION=\"0.0.0-native\"
    -DVERSION_MAJOR=0
    -DVERSION_MINOR=0
    -DVERSION_PATCH=0
    -DVERSION_CHANNEL=3
    -DVERSION_PRE_NUM=0
lib_extra_dirs =
    ../modules
    ../lib
lib_deps =
    google/googletest@^1.15.2
    bblanchon/ArduinoJson@7.4.3
    Application
test_framework = googletest
