; ESP32 App Foundation — App Template
;
; Minimal build configuration for the skeleton template.
; Demonstrates framework integration without weather-specific dependencies.
;
; For the full sample app with display, streaming JSON, and weather data,
; see ../sample-app/platformio.ini.

[platformio]
default_envs = esp32dev

[env:base]
platform = espressif32
framework = arduino, espidf
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_STACK_SIZE=4096
    -DAPP_TITLE=\"ESP32\ App\ Foundation\"
    -DSECURITY_VERSION=1
    -std=gnu++17
    -I ../include
build_unflags = -std=gnu++11
lib_ldf_mode = deep+
lib_compat_mode = strict
extra_scripts =
    pre:../scripts/sync_sdkconfig.py
    pre:../scripts/inject_version.py
lib_extra_dirs = 
    ../modules
    ../lib
lib_deps =
    Application
    bblanchon/ArduinoJson@7.4.3
    hoeken/PsychicHttp@3.0.0

[env:esp32dev]
extends = env:base
board = esp32dev
board_build.partitions = ../partitions.esp32dev.csv
board_build.filesystem = littlefs
custom_sdkconfig = sdkconfig.defaults
upload_speed = 460800
build_flags =
    ${env:base.build_flags}
    -DBOARD_ID=\"esp32dev\"

[env:native]
platform = native
lib_compat_mode = off
lib_ldf_mode = deep+
build_flags =
    -std=c++17
    -DNATIVE_BUILD
    -DUNIT_TEST
    -I ../include
    -I ../
    -DBUILD_VERSION=\"0.0.0-native\"
    -DVERSION_MAJOR=0
    -DVERSION_MINOR=0
    -DVERSION_PATCH=0
    -DVERSION_CHANNEL=3
    -DVERSION_PRE_NUM=0
lib_extra_dirs =
    ../modules
    ../lib
lib_deps =
    google/googletest@^1.15.2
    bblanchon/ArduinoJson@7.4.3
    Application
test_framework = googletest
