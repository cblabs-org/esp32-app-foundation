; ESP32 App Foundation — App Template
;
; Minimal build configuration for the skeleton template.
; Demonstrates framework integration without weather-specific dependencies.
;
; For the full sample app with display, streaming JSON, and weather data,
; see ../sample-app/platformio.ini.

[platformio]
default_envs = esp32dev, esp32s3nano

[env:base]
platform = espressif32
framework = arduino, espidf
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_STACK_SIZE=4096
    -DAPP_TITLE=\"ESP32\ App\ Foundation\"
    -DSECURITY_VERSION=1
    -std=gnu++17
    -I ../include
    -I ../hardware
    -I ../hardware/_common
    -I ../
build_unflags = -std=gnu++11
lib_ldf_mode = deep+
; NOTE: lib_compat_mode is set to 'off' to allow transitive include resolution.
; The framework's U8G2Display module uses SPI.h without declaring SPI as a
; dependency in its library.json. With 'strict' mode, the SPI include path
; is not added to U8G2Display's compilation, causing a build failure.
lib_compat_mode = off
extra_scripts =
    pre:../scripts/sync_sdkconfig.py
    pre:../scripts/inject_version.py
    pre:../scripts/merge_framework_data.py
    pre:../scripts/portalBuilder.py
lib_extra_dirs = 
    ../modules
    ../lib
lib_deps =
    Application
    bblanchon/ArduinoJson@7.4.3
    hoeken/PsychicHttp@3.0.0
    olikraus/U8g2@2.36.18
    SPI

[env:esp32dev]
extends = env:base
board = esp32dev
board_build.partitions = ../hardware/esp32dev/partitions.csv
board_build.filesystem = littlefs
custom_sdkconfig = sdkconfig.defaults
upload_speed = 460800
build_flags =
    ${env:base.build_flags}
    -DBOARD_ID=\"esp32dev\"
    -DBOARD_HEADER=\"../hardware/esp32dev/board.h\"
    -D WITH_DISPLAY_U8G2
    -DU8G2_WITHOUT_FONT_ROTATION
    -DU8G2_WITHOUT_UNICODE

[env:esp32dev_all_on]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D WITH_MCP
    -D WITH_OTA
    -D WITH_TIME

[env:esp32dev_all_off]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -UWITH_TIME

[env:esp32s3nano]
extends = env:base
board = um_nanos3
board_build.partitions = ../hardware/esp32s3nano/partitions.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;../hardware/esp32s3nano/sdkconfig.defaults"
build_flags =
    ${env:base.build_flags}
    -DBOARD_ID=\"esp32s3nano\"
    -DBOARD_HEADER=\"../hardware/esp32s3nano/board.h\"
    -DBOARD_HAS_PSRAM
    -D WITH_DISPLAY_U8G2
    -DU8G2_WITHOUT_FONT_ROTATION
    -DU8G2_WITHOUT_UNICODE

[env:native]
platform = native
; lib_compat_mode off: avoid strict-mode failures on host-only stubs
lib_compat_mode = off
; chain: resolve deps of listed libs only — do NOT pull in lib_extra_dirs
; (deep+ would drag the entire ESP32 framework into the host build,
; triggering undefined APP_TITLE / BOARD_ID / SECURITY_VERSION errors)
lib_ldf_mode = chain
build_flags =
    -std=c++17
    -DUNIT_TEST
    -I ../include
    -I ../hardware
    -I ../hardware/_common
    -I ../
    -I ../test/stubs/platform
    -DBUILD_VERSION=\"0.0.0-native\"
    -DVERSION_MAJOR=0
    -DVERSION_MINOR=0
    -DVERSION_PATCH=0
    -DVERSION_CHANNEL=3
    -DVERSION_PRE_NUM=0
    ; Required by any framework header included transitively on native
    -DAPP_TITLE=\"Template\ App\"
    -DBOARD_ID=\"native\"
    -DBOARD_HEADER=\"../hardware/native/board.h\"
    -DSECURITY_VERSION=1
; lib_deps: ArduinoJson for pure-logic tests; Application for composition root.
; Do NOT add google/googletest here — test_framework = googletest causes
; PlatformIO to manage the googletest runner automatically; adding the lib
; separately shadows the runner's main() and causes an undefined _main link error.
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    Application
    DeviceCrypto
lib_extra_dirs =
    ../modules
    ../lib
lib_ignore = U8G2Display, LVGLDisplay, OTAUpdateManager
test_framework = googletest
