# ESP32 App Foundation (c) 2026 CB Labs
#
# GitHub Actions workflow: .github/workflows/build.yml
# Description: Builds firmware for all target boards on tag push (v*),
#              generates SHA-256 hashes, and uploads unsigned artifacts.
#              Signing and release creation is handled locally via
#              scripts/deploy_release.py.

name: Build Firmware

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        board: [esp32dev, esp32s3nano]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build firmware (${{ matrix.board }})
        run: pio run -e ${{ matrix.board }}

      - name: Rename output binary
        run: |
          cp .pio/build/${{ matrix.board }}/firmware.bin \
             firmware-${{ matrix.board }}.bin

      - name: Generate SHA-256 hash
        run: |
          sha256sum firmware-${{ matrix.board }}.bin \
            > firmware-${{ matrix.board }}.bin.sha256

      - name: Print job summary
        run: |
          echo "### 🔨 Build: ${{ matrix.board }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat firmware-${{ matrix.board }}.bin.sha256 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: |
            firmware-${{ matrix.board }}.bin
            firmware-${{ matrix.board }}.bin.sha256
