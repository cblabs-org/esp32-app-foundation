name: Documentation problem
description: Docs that are wrong, out of date, missing or confusing.
title: "[Docs] "
labels: ["documentation", "P3-docs-dx"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: File path or URL of the page.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
      description: Optional.
