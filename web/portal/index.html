<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="ESP32 Device Configuration Portal">
  <title>ESP32 App Foundation</title>
  <style>
    #loading-splash {
      position: fixed;
      inset: 0;
      z-index: 9998;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      background: #ffffff;
      color: #212529;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      #loading-splash {
        background: #121212;
        color: #e0e0e0;
      }
    }
    .splash-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(33, 150, 243, 0.2);
      border-top-color: #2196F3;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-spinner {
        animation: none;
      }
    }
    .splash-text {
      font-size: 1rem;
      font-weight: 500;
      color: #6c757d;
    }
    @media (prefers-color-scheme: dark) {
      .splash-text {
        color: #adb5bd;
      }
    }
    body.portal-ready #loading-splash {
      display: none;
    }
    body:not(.portal-ready) #portal-title { visibility: hidden; }
  </style>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- ================================================================== -->
  <!-- Inline loading splash: shown during asset & API load               -->
  <!-- ================================================================== -->
  <div id="loading-splash" class="loading-splash" role="status" aria-live="polite">
    <div class="splash-spinner" aria-hidden="true"></div>
    <span class="splash-text">Loading, please wait&hellip;</span>
  </div>

  <a href="#tab-content-area" id="skip-nav" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;z-index:9999;padding:8px 16px;background:var(--primary);color:#fff;text-decoration:none;font-size:0.85rem;border-radius:0 0 8px 0;" onfocus="this.style.cssText='position:fixed;left:0;top:0;width:auto;height:auto;overflow:visible;z-index:9999;padding:8px 16px;background:var(--primary);color:#fff;text-decoration:none;font-size:0.85rem;border-radius:0 0 8px 0;'" onblur="this.style.cssText='position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;'">Skip to main content</a>
  <div class="container">
    <!-- ================================================================== -->
    <!-- Top Bar: App name + theme toggle                                    -->
    <!-- ================================================================== -->
    <header class="top-bar">
      <h2 id="portal-title">ESP32 App Foundation</h2>
      <div style="display: flex; gap: 8px; align-items: center;">
        <button class="theme-btn" id="credits-btn" title="Credits & Info">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="16" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
        </button>
        <div class="theme-toggle" id="theme-toggle">
          <button class="theme-btn" data-theme="auto" title="Auto (System)">
            <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          </button>
          <button class="theme-btn" data-theme="light" title="Light">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
          <button class="theme-btn" data-theme="dark" title="Dark">
            <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- AP mode banner (shown via JS when in AP mode) -->
    <div class="ap-banner" id="ap-banner">
      Access Point Mode Active
    </div>

    <!-- Sub-pill navigation bar (populated by app.js) -->
    <div id="pill-bar" class="pill-bar" role="tablist" aria-label="Sub-navigation" style="display:none;"></div>

    <!-- ================================================================== -->
    <!-- Tab Content Area                                                    -->
    <!-- All tab content divs are dynamically shown/hidden by app.js.        -->
    <!-- Fragment JS files inject their UI into their container div.          -->
    <!-- ================================================================== -->
    <div class="tab-content-container" id="tab-content-area">
      <!-- WiFi tab (top-level, framework) -->
      <div id="tab-wifi" class="tab-content" role="tabpanel" tabindex="0" aria-labelledby="nav-wifi">
        <!-- Populated by wifi.js -->
      </div>

      <!-- Display tab (top-level, contributed by U8G2DisplayModule) -->
      <div id="tab-display" class="tab-content" role="tabpanel" tabindex="0" aria-labelledby="nav-display">
      </div>
      <!-- Display sub-pill: Settings (populated by display.js) -->
      <div id="tab-settings" class="tab-content" role="tabpanel" tabindex="0" aria-labelledby="pill-settings">
      </div>
      <!-- Display sub-pill: Screenshot (populated by screenshot.js) -->
      <div id="tab-screenshot" class="tab-content" role="tabpanel" tabindex="0" aria-labelledby="pill-screenshot">
        <!-- Populated by screenshot.js -->
      </div>
      <!-- Display sub-pill: Carousel (populated by carousel.js, U8G2 only) -->
      <div id="tab-carousel" class="tab-content" role="tabpanel" tabindex="0" aria-labelledby="pill-carousel">
      </div>
      <!-- Display sub-pill: Hardware (populated by hardware.js, LVGL only) -->
      <div id="tab-hardware" class="tab-content" role="tabpanel" tabindex="0" aria-labelledby="pill-hardware">
      </div>

      <!-- App tab (top-level, application-level config) -->
      <div id="tab-app" class="tab-content" role="tabpanel" tabindex="0" aria-labelledby="nav-app">
        <!-- Populated by appconfig.js -->
      </div>

      <!-- Security tab (top-level parent, contributed by AuthManager) -->
      <div id="tab-security" class="tab-content" role="tabpanel" tabindex="0" aria-labelledby="nav-security">
      </div>
      <!-- Security sub-pill: Password (populated by auth.js) -->
      <div id="tab-password" class="tab-content" role="tabpanel" tabindex="0" aria-labelledby="pill-password">
      </div>
      <!-- Security sub-pill: TLS (populated by auth.js) -->
      <div id="tab-tls" class="tab-content" role="tabpanel" tabindex="0" aria-labelledby="pill-tls">
      </div>

      <!-- System tab (top-level parent, framework) -->
      <div id="tab-system" class="tab-content" role="tabpanel" tabindex="0" aria-labelledby="nav-system">
      </div>
      <!-- System sub-pill: Status (populated by system.js) -->
      <div id="tab-status" class="tab-content" role="tabpanel" tabindex="0" aria-labelledby="pill-status">
      </div>
      <!-- System sub-pill: Time (populated by time.js) -->
      <div id="tab-time" class="tab-content" role="tabpanel" tabindex="0" aria-labelledby="pill-time">
      </div>
      <div id="tab-keys" class="tab-content" role="tabpanel" tabindex="0" aria-labelledby="pill-keys">
        <!-- Populated by keys.js -->
      </div>
      <div id="tab-mcp" class="tab-content" role="tabpanel" tabindex="0" aria-labelledby="pill-mcp">
        <!-- Populated by mcp.js -->
      </div>
      <div id="tab-backup" class="tab-content" role="tabpanel" tabindex="0" aria-labelledby="pill-backup">
        <!-- Populated by backup.js -->
      </div>
      <div id="tab-ota" class="tab-content" role="tabpanel" tabindex="0" aria-labelledby="pill-ota">
        <!-- Populated by ota.js -->
      </div>
    </div>

    <!-- Toast notification container -->
    <div id="toast-container"></div>

    <!-- ================================================================== -->
    <!-- Bottom Navigation Bar                                               -->
    <!-- Framework tabs (WiFi, System) are hardcoded with SVG icons.          -->
    <!-- App tabs are injected dynamically by app.js.                        -->
    <!-- ================================================================== -->
    <nav class="bottom-nav" id="bottom-nav" role="tablist" aria-label="Main navigation">
      <a href="#" class="tab-link" data-target="tab-wifi" data-order="10" id="nav-wifi" role="tab" aria-selected="false" aria-controls="tab-wifi">
        <span class="icon">
          <!-- WiFi arcs SVG -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
            <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <line x1="12" y1="20" x2="12.01" y2="20"/>
          </svg>
        </span>
        WIFI
      </a>
      <!-- Security tab — hardcoded with lock icon; auth.js populates content -->
      <a href="#" class="tab-link" data-target="tab-security" data-order="50" id="nav-security" role="tab" aria-selected="false" aria-controls="tab-security">
        <span class="icon">
          <!-- Feather-icons padlock SVG -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </span>
        SECURITY
      </a>
      <a href="#" class="tab-link" data-target="tab-system" data-order="900" id="nav-system" role="tab" aria-selected="false" aria-controls="tab-system">
        <span class="icon">
          <!-- Gear/Settings SVG -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </span>
        SYSTEM
      </a>
      <!-- App-contributed tabs are injected here by app.js -->
    </nav>
  </div>

  <!-- Load app.js — this bootstraps everything else -->
  <script src="app.js"></script>

  <!-- Credits Modal -->
  <dialog id="credits-dialog">
    <div style="position:relative;">
      <button id="credits-close" style="position:absolute; top:8px; right:8px; background:none; border:none; color:inherit; cursor:pointer; padding:4px;" title="Close">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div id="tab-credits">
        <!-- Populated by credits.js -->
      </div>
    </div>
  </dialog>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var btn = document.getElementById('credits-btn');
      var dialog = document.getElementById('credits-dialog');
      var closeBtn = document.getElementById('credits-close');
      if (btn && dialog && closeBtn) {
        btn.addEventListener('click', function() { dialog.showModal(); });
        closeBtn.addEventListener('click', function() { dialog.close(); });
        dialog.addEventListener('click', function(e) {
          if (e.target === dialog) dialog.close();
        });
      }
    });
  </script>
</body>
</html>
