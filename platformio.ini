; =============================================================================
; ESP32 App Foundation — PlatformIO Configuration
; =============================================================================
; Dual-framework (Arduino + ESP-IDF) monorepo configuration.
; Three environments:
;   esp32dev        — Espressif ESP-WROOM-32 (4MB flash, PSRAM optional)
;   esp32s3nano     — Waveshare ESP32-S3-Nano (8MB flash, QSPI PSRAM)
;   crowpanel-128-rotary — Elecrow CrowPanel 1.28" ESP32-S3 HMI Rotary Display
;   native          — Host CPU GoogleTest runner (no hardware required)
;
; IMPORTANT: When building or flashing, ALWAYS specify the environment explicitly
; to prevent PlatformIO from targeting all envs simultaneously.
;
; QUALITY GATE NOTE:
;   Run 'python3 scripts/doc_lint.py' manually to check documentation health.
;   (Automatic CI integration pending #144).
; =============================================================================

[platformio]
default_envs = esp32dev, esp32s3nano

; ---------------------------------------------------------------------------
; Shared base — inherited by both hardware environments
; ---------------------------------------------------------------------------
[env:base_esp32]
platform              = espressif32
framework             = arduino, espidf
monitor_speed         = 115200
upload_speed          = 460800
build_flags           =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_STACK_SIZE=4096
    -DSECURITY_VERSION=1
    -D WITH_DISPLAY_U8G2
    -D WITH_TIME
    -std=gnu++17
    -I include
    -I modules
    -I hardware
    -I hardware/_common
    -I .
build_unflags         = -std=gnu++11
lib_compat_mode       = strict
lib_ldf_mode          = deep
lib_extra_dirs        = modules
; NetworkClientSecure is built by the framework core in dual-framework mode.
; Suppress the LDF's duplicate compilation which produces an empty ssl_client.o.
lib_ignore            = LVGLDisplay
extra_scripts         = pre:scripts/sync_sdkconfig.py
                        pre:scripts/run_web_tests.py
                        pre:scripts/portalBuilder.py
                        pre:scripts/inject_version.py

; ---------------------------------------------------------------------------
; esp32dev — ESP-WROOM-32 / generic ESP32
; ---------------------------------------------------------------------------
[env:esp32dev]
extends               = env:base_esp32
board                 = esp32dev
board_build.partitions = hardware/esp32dev/partitions.csv
board_build.filesystem = littlefs
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"
build_flags           =
    ${env:base_esp32.build_flags}
    -DBOARD_ID=\"esp32dev\"
    -DBOARD_HEADER=\"hardware/esp32dev/board.h\"
    -D WITH_DISPLAY_U8G2 ; Hardware-sourced availability flag (HC-6)
    -D WITH_MCP
    -D WITH_AUDIT
    -DU8G2_WITHOUT_FONT_ROTATION
    -DU8G2_WITHOUT_UNICODE
lib_deps              =
    bblanchon/ArduinoJson@^7.4.3
    hoeken/PsychicHttp@^3.0.0
    olikraus/U8g2@^2.36.18
    squix78/JsonStreamingParser@^1.0.5
lib_ignore            = LVGLDisplay

[env:esp32dev_ha]
extends               = env:esp32dev
build_flags           =
    ${env:esp32dev.build_flags}
    -D WITH_HOMEASSISTANT

; ---------------------------------------------------------------------------
; esp32s3nano — Waveshare ESP32-S3-Nano (Arduino Nano ESP32 compatible)
; ---------------------------------------------------------------------------
[env:esp32s3nano]
extends               = env:base_esp32
board                 = arduino_nano_esp32
upload_protocol       = esptool
board_build.partitions = hardware/esp32s3nano/partitions.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;hardware/esp32s3nano/sdkconfig.defaults"
build_flags           =
    ${env:base_esp32.build_flags}
    -DBOARD_ID=\"esp32s3nano\"
    -DBOARD_HEADER=\"hardware/esp32s3nano/board.h\"
    -DBOARD_HAS_PSRAM
    -D WITH_DISPLAY_U8G2 ; Hardware-sourced availability flag (HC-6)
    -D WITH_MCP
    -D WITH_AUDIT
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DU8G2_WITHOUT_FONT_ROTATION
    -DU8G2_WITHOUT_UNICODE
lib_deps              =
    bblanchon/ArduinoJson@^7.4.3
    hoeken/PsychicHttp@^3.0.0
    olikraus/U8g2@^2.36.18
    squix78/JsonStreamingParser@^1.0.5
lib_ignore            = LVGLDisplay

; ---------------------------------------------------------------------------
; BLE mix-in — inherited by BLE-enabled environments
; ---------------------------------------------------------------------------
; Provides WITH_BLE build flag and the NimBLE C++ library dependency.
; Consumer envs extend their base hardware env and merge ${ble.*}.
; The library choice (esp-nimble-cpp vs NimBLE-Arduino) is settled by WO-0.
[ble]
build_flags           = -D WITH_BLE
lib_deps              =
    h2zero/esp-nimble-cpp@^2.1.0
    BLEManager

; ---------------------------------------------------------------------------
; esp32s3nano_ble — Waveshare ESP32-S3-Nano with BLE enabled
; ---------------------------------------------------------------------------
[env:esp32s3nano_ble]
extends               = env:esp32s3nano
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;hardware/esp32s3nano/sdkconfig.defaults;hardware/_common/sdkconfig.ble.defaults"
build_flags           =
    ${env:esp32s3nano.build_flags}
    ${ble.build_flags}
lib_deps              =
    ${env:esp32s3nano.lib_deps}
    ${ble.lib_deps}



; ---------------------------------------------------------------------------
; crowpanel-128-rotary — Elecrow CrowPanel 1.28" ESP32-S3 HMI Rotary Display
; ---------------------------------------------------------------------------
[env:crowpanel-128-rotary]
extends               = env:base_esp32
board                 = esp32-s3-devkitc-1
board_build.mcu       = esp32s3
board_build.f_cpu     = 240000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = hardware/crowpanel-128-rotary/partitions.csv
board_build.filesystem = littlefs
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;hardware/crowpanel-128-rotary/sdkconfig.defaults"
lib_extra_dirs        = modules, adapters, uidesign/crowpanel-128-rotary
build_flags           =
    ${env:base_esp32.build_flags}
    -DBOARD_ID=\"crowpanel-128-rotary\"
    -DBOARD_HEADER=\"hardware/crowpanel-128-rotary/board.h\"
    -DBOARD_HAS_PSRAM
    -D WITH_DISPLAY_LVGL
    -D WITH_ENCODER
    -D WITH_BUTTONS
    -D WITH_MCP
    -D WITH_AUDIT
    -DLV_CONF_PATH=\"${PROJECT_DIR}/modules/LVGLDisplay/lv_conf.h\"
build_unflags         = -DWITH_DISPLAY_U8G2
lib_deps              =
    bblanchon/ArduinoJson@^7.4.3
    hoeken/PsychicHttp@^3.0.0
    squix78/JsonStreamingParser@^1.0.5
    lvgl/lvgl@^9.5.0
    lovyan03/LovyanGFX@^1.1.16
    EventBus
lib_ignore            = U8G2Display

; ---------------------------------------------------------------------------
; native — GoogleTest host runner (no hardware)
; ---------------------------------------------------------------------------
; CONFIG_LOG_MAXIMUM_LEVEL=5 below compiles the verbose logging paths
; (LogPipeline heap buffer, dumpPayload, StructuralScrubber). Boards ship at
; level 3, which strips ESP_LOGD/ESP_LOGV and preprocesses those paths out --
; without this the host suite could never build or exercise them.
[env:native]
platform              = native
build_flags           =
    -std=c++17
    -DUNIT_TEST
    -DCONFIG_LOG_MAXIMUM_LEVEL=5
    -DBOARD_ID=\"native\"
    -DBOARD_HEADER=\"hardware/native/board.h\"
    -DBUILD_VERSION=\"0.0.0-native\"
    -DVERSION_MAJOR=0
    -DVERSION_MINOR=0
    -DVERSION_PATCH=0
    -DVERSION_CHANNEL=3
    -DVERSION_PRE_NUM=0
    -DSECURITY_VERSION=1
    -D WITH_TIME
    -D WITH_AUDIT
    -D WITH_BLE
    -DU8G2_WITHOUT_FONT_ROTATION
    -DU8G2_WITHOUT_UNICODE
    -DWITH_DISPLAY_U8G2
    -DARDUINO=100
    ; LogShim.h resolves esp_log.h from this path on native builds.
    ; See include/platform/LogShim.h for the design rationale.
    -I test/stubs/platform
    -I .pio/libdeps/native/U8g2/src
    -I .pio/libdeps/native/U8g2/src/clib
    -I include
    -I modules
    -I hardware
    -I hardware/_common
    -I .
; Do NOT add google/googletest here — test_framework = googletest causes
; PlatformIO to manage the googletest runner automatically; adding the lib
; separately shadows the runner's main() and causes an undefined _main link error.
lib_deps              =
    bblanchon/ArduinoJson@^7.4.3
    olikraus/U8g2@^2.36.18
test_framework        = googletest
lib_extra_dirs        = modules, adapters
lib_ldf_mode          = chain+
lib_compat_mode       = soft
lib_ignore            = LVGL_Adapters, CrowPanel128Adapter, PngWriter
test_ignore           = test_native/test_hardware_board, test_unit/test_helpers
test_filter           = test_unit/*, test_native/*

[env:native_ha]
extends               = env:native
build_flags           =
    ${env:native.build_flags}
    -D WITH_HOMEASSISTANT

