; =============================================================================
; ESP32 App Foundation — PlatformIO Configuration
; =============================================================================
; Dual-framework (Arduino + ESP-IDF) monorepo configuration.
; Three environments:
;   esp32dev        — Espressif ESP-WROOM-32 (4MB flash, PSRAM optional)
;   esp32s3nano     — Waveshare ESP32-S3-Nano (8MB flash, QSPI PSRAM)
;   native          — Host CPU GoogleTest runner (no hardware required)
;
; IMPORTANT: When building or flashing, ALWAYS specify the environment explicitly
; to prevent PlatformIO from targeting all envs simultaneously.
; =============================================================================

[platformio]
default_envs = esp32dev, esp32s3nano

; ---------------------------------------------------------------------------
; Shared base — inherited by both hardware environments
; ---------------------------------------------------------------------------
[env:base_esp32]
platform              = espressif32
framework             = arduino, espidf
monitor_speed         = 115200
upload_speed          = 460800
build_flags           =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_STACK_SIZE=4096
    -DAPP_FOUNDATION_VERSION=\"0.1.0\"
    -DAPP_TITLE=\"ESP32\ App\ Foundation\"
    -DVERSION_MAJOR=0
    -DVERSION_MINOR=1
    -DVERSION_PATCH=0
    -DSECURITY_VERSION=1
    -std=gnu++17
    -I include
build_unflags         = -std=gnu++11
lib_compat_mode       = strict
lib_extra_dirs        = modules
; NetworkClientSecure is built by the framework core in dual-framework mode.
; Suppress the LDF's duplicate compilation which produces an empty ssl_client.o.
lib_ignore            = NetworkClientSecure
extra_scripts         = pre:scripts/run_web_tests.py
                        pre:scripts/portalBuilder.py
                        pre:scripts/inject_version.py

; ---------------------------------------------------------------------------
; esp32dev — ESP-WROOM-32 / generic ESP32
; ---------------------------------------------------------------------------
[env:esp32dev]
extends               = env:base_esp32
board                 = esp32dev
board_build.partitions = partitions.esp32dev.csv
board_build.filesystem = littlefs
custom_sdkconfig      = sdkconfig.defaults
build_flags           =
    ${env:base_esp32.build_flags}
    -DBOARD_ID=\"esp32dev\"
    ; --- Display: SSD1322 via 4-wire HW SPI ---
    -DU8G2_DISPLAY_TYPE=U8G2_SSD1322_NHD_256X64_F_4W_HW_SPI
    -DU8G2_WITHOUT_FONT_ROTATION
    -DU8G2_WITHOUT_UNICODE
    -DDISPLAY_CS_PIN=26
    -DDISPLAY_DC_PIN=5
    -DDISPLAY_SPI_SCK=18
    -DDISPLAY_SPI_MISO=19
    -DDISPLAY_SPI_MOSI=23
lib_deps              =
    bblanchon/ArduinoJson@^7.4.3
    ESP32Async/ESPAsyncWebServer@^3.7.7
    ESP32Async/AsyncTCP@^3.4.5
    olikraus/U8g2@^2.36.18

; ---------------------------------------------------------------------------
; esp32s3nano — Waveshare ESP32-S3-Nano
; ---------------------------------------------------------------------------
[env:esp32s3nano]
extends               = env:base_esp32
board                 = um_nanos3
board_build.partitions = partitions.esp32s3nano.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
custom_sdkconfig      = sdkconfig.defaults.esp32s3nano
build_flags           =
    ${env:base_esp32.build_flags}
    -DBOARD_ID=\"esp32s3nano\"
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; --- Display: SSD1322 via 4-wire HW SPI ---
    -DU8G2_DISPLAY_TYPE=U8G2_SSD1322_NHD_256X64_F_4W_HW_SPI
    -DU8G2_WITHOUT_FONT_ROTATION
    -DU8G2_WITHOUT_UNICODE
    -DDISPLAY_CS_PIN=10
    -DDISPLAY_DC_PIN=9
    -DDISPLAY_SPI_SCK=48
    -DDISPLAY_SPI_MISO=47
    -DDISPLAY_SPI_MOSI=38
lib_deps              =
    bblanchon/ArduinoJson@^7.4.3
    ESP32Async/ESPAsyncWebServer@^3.7.7
    ESP32Async/AsyncTCP@^3.4.5
    olikraus/U8g2@^2.36.18

; ---------------------------------------------------------------------------
; native — GoogleTest host runner (no hardware)
; ---------------------------------------------------------------------------
[env:native]
platform              = native
build_flags           =
    -std=c++17
    -DNATIVE_BUILD
    -DUNIT_TEST
    -DBOARD_ID=\"native\"
    -DAPP_FOUNDATION_VERSION=\"0.1.0\"
    -DAPP_TITLE=\"ESP32\ App\ Foundation\"
    -DVERSION_MAJOR=0
    -DVERSION_MINOR=1
    -DVERSION_PATCH=0
    -DSECURITY_VERSION=1
    -I include
lib_deps              =
    google/googletest@^1.15.2
    bblanchon/ArduinoJson@^7.4.3
test_framework        = googletest
lib_extra_dirs        = modules
test_filter           = test_unit/*
