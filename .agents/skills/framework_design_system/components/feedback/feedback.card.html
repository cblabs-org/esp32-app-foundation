<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{height:100%}body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--text)}.wrap{padding:20px}.grp{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.col{display:flex;flex-direction:column;gap:10px}.lbl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);margin:6px 0 2px;width:100%}a{color:var(--primary)}a:hover{color:var(--primary-hover)}</style></head><body><div class="wrap" id="root"></div>
<script type="text/babel">
const { Alert, Callout, Toast, Dialog, Button, RebootOverlay, LoginCard } = window.ESP32AppFoundationDesignSystem_aaa6bc;
function Demo(){
  const [open,setOpen]=React.useState(false);
  const [reboot,setReboot]=React.useState(false);
  return (<div className="grp" style={{alignItems:'flex-start'}}>
    <div className="col" style={{maxWidth:320}}>
      <div className="lbl">Alerts</div>
      <Alert variant="info">Configure the device before proceeding.</Alert>
      <Alert variant="success">Connected. IP 192.168.1.42</Alert>
      <Alert variant="error">Connection failed. Check the password.</Alert>
      <div className="lbl">Callout · Toasts</div>
      <Callout>Hold BOOT for 3 seconds to enter pairing mode.</Callout>
      <Toast type="success">Configuration saved.</Toast>
      <div className="grp">
        <Button variant="outline" onClick={()=>setOpen(true)}>Dialog</Button>
        <Button variant="secondary" onClick={()=>{setReboot(true);setTimeout(()=>setReboot(false),1800);}}>Reboot overlay</Button>
      </div>
    </div>
    <div className="col">
      <div className="lbl">LoginCard (401 gate)</div>
      <LoginCard error="Incorrect password" style={{width:300}}/>
    </div>
    <Dialog open={open} onClose={()=>setOpen(false)}>
      <h2 style={{marginTop:0,color:'var(--primary)'}}>Credits & Info</h2>
      <p style={{fontSize:14,color:'var(--text-muted)'}}>ESP32 App Foundation portal.</p>
    </Dialog>
    {reboot && <RebootOverlay visible message="Restarting device…"/>}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
