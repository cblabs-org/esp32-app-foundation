<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>html,body{height:100%}body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--text)}.wrap{padding:20px}.grp{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.col{display:flex;flex-direction:column;gap:10px}.lbl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);margin:6px 0 2px;width:100%}a{color:var(--primary)}a:hover{color:var(--primary-hover)}</style></head><body><div class="wrap" id="root"></div>
<script type="text/babel">
const { Card, StatusDot, Badge, ProgressBar, SignalBars, InfoRow, DiagTable, TerminalLog } = window.ESP32AppFoundationDesignSystem_aaa6bc;
function Demo(){
  return (<div className="grp" style={{alignItems:'flex-start'}}>
    <div className="col" style={{maxWidth:320}}>
      <Card header="Device Information">
        <InfoRow label="Firmware" value="v2.4.1"/>
        <InfoRow label="Chip" value="ESP32-S3 rev 0"/>
        <InfoRow label="Uptime" value="2d 5h 13m"/>
        <InfoRow label="Signal" value={<span style={{display:'inline-flex',gap:6,alignItems:'center'}}>-58 dBm <SignalBars rssi={-58}/></span>} last/>
      </Card>
      <div className="lbl">DiagTable</div>
      <DiagTable rows={[['MAC','A4:CF:12:98:2B:0E'],['Channel','6'],['Gateway','192.168.1.1']]}/>
    </div>
    <div className="col" style={{maxWidth:320}}>
      <Card header="Memory & Storage">
        <ProgressBar label="Free Heap" value={142} max={320} valueText="142 KB (44%)"/>
        <ProgressBar label="PSRAM Free" value={60} max={320} valueText="60 KB (19%)"/>
        <ProgressBar label="Storage Free" value={900} max={1500} valueText="900 KB (60%)"/>
      </Card>
      <div className="lbl">Status dots · badges</div>
      <div className="grp">
        <StatusDot status="green" label="Connected"/>
        <StatusDot status="yellow" pulse label="Connecting"/>
        <StatusDot status="red" label="Offline"/>
      </div>
      <div className="grp">
        <Badge variant="ok">Connected</Badge>
        <Badge variant="warn">Degraded</Badge>
        <Badge variant="mode">STA</Badge>
        <Badge variant="subtle">Experimental</Badge>
      </div>
      <div className="lbl">TerminalLog</div>
      <TerminalLog lines={['[boot] App Foundation v2.4.1','[wifi] connecting to workshop-2.4G…','[wifi] got IP 192.168.1.42','[ota] channel=stable up to date']}/>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
