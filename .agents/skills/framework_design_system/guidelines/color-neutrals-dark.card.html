<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals — Dark" subtitle="[data-theme=dark] surfaces, borders & text" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--text);background:#121212;color:#e0e0e0}.card-body{padding:18px}a{color:var(--primary)}a:hover{color:var(--primary-hover)}.sw{display:flex;flex-wrap:wrap;gap:10px}.chip{border-radius:10px;border:1px solid var(--border);overflow:hidden;width:150px}.chip .col{height:56px}.chip .meta{padding:6px 8px;font-size:11px;line-height:1.4}.chip .nm{font-weight:700}.chip .hx{color:var(--text-muted);font-family:var(--font-mono);font-size:10px;text-transform:uppercase}</style></head><body data-theme="dark"><div class="card-body"><div class="sw">
<div class="chip" style="border-color:#333"><div class="col" style="background:#121212"></div><div class="meta"><div class="nm">--bg</div><div class="hx">#121212</div></div></div>
<div class="chip" style="border-color:#333"><div class="col" style="background:#1e1e1e"></div><div class="meta"><div class="nm">--card-bg</div><div class="hx">#1e1e1e</div></div></div>
<div class="chip" style="border-color:#333"><div class="col" style="background:#333333"></div><div class="meta"><div class="nm">--border</div><div class="hx">#333333</div></div></div>
<div class="chip" style="border-color:#333"><div class="col" style="background:#adb5bd"></div><div class="meta"><div class="nm">--text-muted</div><div class="hx">#adb5bd</div></div></div>
<div class="chip" style="border-color:#333"><div class="col" style="background:#e0e0e0"></div><div class="meta"><div class="nm">--text</div><div class="hx">#e0e0e0</div></div></div>
</div></div></body></html>
