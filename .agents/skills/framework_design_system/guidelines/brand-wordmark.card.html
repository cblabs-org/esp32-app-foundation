<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--text)}.card-body{padding:18px}a{color:var(--primary)}a:hover{color:var(--primary-hover)}</style></head><body><div class="card-body">
<div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
<h2 style="margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.5px;color:var(--primary)">ESP32 App Foundation</h2>
<span style="font-size:0.85rem;color:var(--text-muted);text-transform:uppercase;font-weight:700;letter-spacing:.5px">Configuration Portal</span>
</div>
<p style="font-size:12px;color:var(--text-muted);margin:14px 0 0;max-width:560px;line-height:1.5">The portal ships no logo asset. The product name is set in the system sans at <code style="font-family:var(--font-mono)">1.5rem / 800</code>, tight tracking, in <code style="font-family:var(--font-mono)">--primary</code>. Downstream apps override the title text and <code style="font-family:var(--font-mono)">--primary</code> to rebrand.</p>
</div></body></html>
