<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--text);}.card-body{padding:18px}a{color:var(--primary)}a:hover{color:var(--primary-hover)}.sw{display:flex;flex-wrap:wrap;gap:10px}.chip{border-radius:10px;border:1px solid var(--border);overflow:hidden;width:150px}.chip .col{height:56px}.chip .meta{padding:6px 8px;font-size:11px;line-height:1.4}.chip .nm{font-weight:700}.chip .hx{color:var(--text-muted);font-family:var(--font-mono);font-size:10px;text-transform:uppercase}</style></head><body><div class="card-body"><div class="sw" style="gap:22px">
<div style="text-align:center;font-size:10px"><div style="width:96px;height:60px;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1)"></div><div style="font-family:var(--font-mono);margin-top:8px">--shadow-card-hover</div><div style="color:var(--text-muted)">hover lift</div></div><div style="text-align:center;font-size:10px"><div style="width:96px;height:60px;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.25)"></div><div style="font-family:var(--font-mono);margin-top:8px">--shadow-toggle-knob</div><div style="color:var(--text-muted)">switch knob</div></div><div style="text-align:center;font-size:10px"><div style="width:96px;height:60px;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,.2)"></div><div style="font-family:var(--font-mono);margin-top:8px">--shadow-dialog</div><div style="color:var(--text-muted)">modal</div></div><div style="text-align:center;font-size:10px"><div style="width:96px;height:60px;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.3)"></div><div style="font-family:var(--font-mono);margin-top:8px">--shadow-login</div><div style="color:var(--text-muted)">overlay card</div></div>
</div></div></body></html>
