<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals — Light" subtitle="Default theme surfaces, borders & text" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--text);}.card-body{padding:18px}a{color:var(--primary)}a:hover{color:var(--primary-hover)}.sw{display:flex;flex-wrap:wrap;gap:10px}.chip{border-radius:10px;border:1px solid var(--border);overflow:hidden;width:150px}.chip .col{height:56px}.chip .meta{padding:6px 8px;font-size:11px;line-height:1.4}.chip .nm{font-weight:700}.chip .hx{color:var(--text-muted);font-family:var(--font-mono);font-size:10px;text-transform:uppercase}</style></head><body><div class="card-body"><div class="sw">
<div class="chip"><div class="col" style="background:var(--white)"></div><div class="meta"><div class="nm">--bg</div><div class="hx">#ffffff</div></div></div>
<div class="chip"><div class="col" style="background:var(--grey-50)"></div><div class="meta"><div class="nm">--card-bg</div><div class="hx">#f8f9fa</div></div></div>
<div class="chip"><div class="col" style="background:var(--grey-300)"></div><div class="meta"><div class="nm">--border</div><div class="hx">#dee2e6</div></div></div>
<div class="chip"><div class="col" style="background:var(--grey-600)"></div><div class="meta"><div class="nm">--text-muted</div><div class="hx">#6c757d</div></div></div>
<div class="chip"><div class="col" style="background:var(--grey-900)"></div><div class="meta"><div class="nm">--text</div><div class="hx">#212529</div></div></div>
</div></div></body></html>
