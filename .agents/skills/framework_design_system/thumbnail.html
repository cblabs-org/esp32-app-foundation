<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><style>
*{margin:0;box-sizing:border-box}html,body{width:1280px;height:854px;overflow:hidden}
.tile{display:flex;width:1280px;height:854px;font-family:var(--font-sans)}
.main{flex:1;background:var(--primary);display:flex;align-items:center;justify-content:center;padding:0 70px}
.mark{color:#fff;text-align:center;font-weight:800;letter-spacing:-2px;line-height:1.02;font-size:150px}
.mark small{display:block;font-size:44px;font-weight:700;letter-spacing:6px;opacity:.82;margin-top:26px}
.strip{width:300px;display:flex;flex-direction:column}
.strip span{flex:1}
</style></head><body>
<div class="tile">
<div class="main"><div class="mark">ESP32<small>APP FOUNDATION</small></div></div>
<div class="strip">
<span style="background:#f9a825"></span>
<span style="background:#2e7d32"></span>
<span style="background:#c62828"></span>
</div>
</div>
</body></html>
