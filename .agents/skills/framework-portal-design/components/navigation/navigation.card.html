<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{height:100%}body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--text)}.wrap{padding:20px}.grp{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.col{display:flex;flex-direction:column;gap:10px;max-width:300px}.lbl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);margin:6px 0 2px;width:100%}a{color:var(--primary)}a:hover{color:var(--primary-hover)}</style></head><body><div class="wrap" id="root"></div>
<script type="text/babel">
const { PillBar, ThemeToggle, Drawer, InfoRow } = window.ESP32AppFoundationDesignSystem_aaa6bc;
function Demo(){
  const [tab,setTab]=React.useState('Status');
  const [theme,setTheme]=React.useState('auto');
  return (<div className="col" style={{maxWidth:420}}>
    <div class="lbl">Sub-pill navigation</div>
    <PillBar items={['Status','Time','OTA','Keys','MCP','Backup']} active={tab} onSelect={setTab}/>
    <div class="lbl">Theme toggle</div>
    <ThemeToggle value={theme} onChange={setTheme}/>
    <div class="lbl">Drawers</div>
    <Drawer summary="Network Diagnostics" variant="info" open>
      <InfoRow label="Gateway" value="192.168.1.1"/>
      <InfoRow label="MAC" value="A4:CF:12:98:2B:0E" last/>
    </Drawer>
    <Drawer summary="Advanced" variant="advanced">
      <p style={{fontSize:13,color:'var(--text-muted)',margin:'4px 0'}}>Upload a signed firmware binary directly.</p>
    </Drawer>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
