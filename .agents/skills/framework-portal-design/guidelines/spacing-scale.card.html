<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing Scale" subtitle="rem-based, as authored (not a strict 4/8 grid)" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--text);}.card-body{padding:18px}a{color:var(--primary)}a:hover{color:var(--primary-hover)}.sw{display:flex;flex-wrap:wrap;gap:10px}.chip{border-radius:10px;border:1px solid var(--border);overflow:hidden;width:150px}.chip .col{height:56px}.chip .meta{padding:6px 8px;font-size:11px;line-height:1.4}.chip .nm{font-weight:700}.chip .hx{color:var(--text-muted);font-family:var(--font-mono);font-size:10px;text-transform:uppercase}</style></head><body><div class="card-body" style="display:flex;flex-direction:column;gap:8px;font-size:12px">
<div style="display:flex;align-items:center;gap:12px"><div style="width:4px;height:14px;background:var(--primary);border-radius:2px;flex-shrink:0"></div><span style="font-family:var(--font-mono);width:90px">--space-1</span><span style="color:var(--text-muted)">0.25rem · 4px</span></div><div style="display:flex;align-items:center;gap:12px"><div style="width:~6px;height:14px;background:var(--primary);border-radius:2px;flex-shrink:0"></div><span style="font-family:var(--font-mono);width:90px">--space-2</span><span style="color:var(--text-muted)">0.4rem · ~6px</span></div><div style="display:flex;align-items:center;gap:12px"><div style="width:8px;height:14px;background:var(--primary);border-radius:2px;flex-shrink:0"></div><span style="font-family:var(--font-mono);width:90px">--space-3</span><span style="color:var(--text-muted)">0.5rem · 8px</span></div><div style="display:flex;align-items:center;gap:12px"><div style="width:12px;height:14px;background:var(--primary);border-radius:2px;flex-shrink:0"></div><span style="font-family:var(--font-mono);width:90px">--space-4</span><span style="color:var(--text-muted)">0.75rem · 12px</span></div><div style="display:flex;align-items:center;gap:12px"><div style="width:16px;height:14px;background:var(--primary);border-radius:2px;flex-shrink:0"></div><span style="font-family:var(--font-mono);width:90px">--space-5</span><span style="color:var(--text-muted)">1rem · 16px</span></div><div style="display:flex;align-items:center;gap:12px"><div style="width:20px;height:14px;background:var(--primary);border-radius:2px;flex-shrink:0"></div><span style="font-family:var(--font-mono);width:90px">--space-6</span><span style="color:var(--text-muted)">1.25rem · 20px</span></div><div style="display:flex;align-items:center;gap:12px"><div style="width:24px;height:14px;background:var(--primary);border-radius:2px;flex-shrink:0"></div><span style="font-family:var(--font-mono);width:90px">--space-7</span><span style="color:var(--text-muted)">1.5rem · 24px</span></div><div style="display:flex;align-items:center;gap:12px"><div style="width:32px;height:14px;background:var(--primary);border-radius:2px;flex-shrink:0"></div><span style="font-family:var(--font-mono);width:90px">--space-8</span><span style="color:var(--text-muted)">2rem · 32px</span></div>
</div></body></html>
