<!-- @dsCard group="Colors" viewport="700x220" name="Dark Theme in Use" subtitle="[data-theme=dark] applied to real surfaces side-by-side" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--text)}.card-body{padding:18px}a{color:var(--primary)}a:hover{color:var(--primary-hover)}</style></head><body><div class="card-body" style="display:flex;gap:14px">
<div data-theme="" style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;color:var(--text)">
<div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);font-weight:700;margin-bottom:8px">light</div>
<div style="background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px">
<div style="font-weight:700;color:var(--primary);margin-bottom:6px">WiFi Settings</div>
<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid var(--border)"><span style="color:var(--text-muted)">Status</span><strong>Connected</strong></div>
<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0"><span style="color:var(--text-muted)">IP</span><strong style="font-family:var(--font-mono)">192.168.1.42</strong></div>
</div>
<button style="width:100%;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:.6rem;font-weight:700;font-size:13px">Save & Connect</button>
</div><div data-theme="dark" style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;color:var(--text)">
<div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);font-weight:700;margin-bottom:8px">dark</div>
<div style="background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px">
<div style="font-weight:700;color:var(--primary);margin-bottom:6px">WiFi Settings</div>
<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid var(--border)"><span style="color:var(--text-muted)">Status</span><strong>Connected</strong></div>
<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0"><span style="color:var(--text-muted)">IP</span><strong style="font-family:var(--font-mono)">192.168.1.42</strong></div>
</div>
<button style="width:100%;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:.6rem;font-weight:700;font-size:13px">Save & Connect</button>
</div>
</div></body></html>
