<!-- @dsCard group="Effects" viewport="700x150" name="Motion" subtitle="Quick, functional easing — 0.15s to 0.5s ease" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--text);}.card-body{padding:18px}a{color:var(--primary)}a:hover{color:var(--primary-hover)}.sw{display:flex;flex-wrap:wrap;gap:10px}.chip{border-radius:10px;border:1px solid var(--border);overflow:hidden;width:150px}.chip .col{height:56px}.chip .meta{padding:6px 8px;font-size:11px;line-height:1.4}.chip .nm{font-weight:700}.chip .hx{color:var(--text-muted);font-family:var(--font-mono);font-size:10px;text-transform:uppercase}</style></head><body><div class="card-body" style="display:flex;flex-direction:column;gap:7px;font-size:12px">
<div style="display:flex;gap:12px"><span style="font-family:var(--font-mono);width:180px">--transition-fast</span><span style="width:90px">0.15s ease</span><span style="color:var(--text-muted)">card lift, pill hover</span></div><div style="display:flex;gap:12px"><span style="font-family:var(--font-mono);width:180px">--transition-base</span><span style="width:90px">0.2s ease</span><span style="color:var(--text-muted)">buttons, inputs, theme</span></div><div style="display:flex;gap:12px"><span style="font-family:var(--font-mono);width:180px">--transition-slow</span><span style="width:90px">0.3s ease</span><span style="color:var(--text-muted)">theme swap, toggles, toasts</span></div><div style="display:flex;gap:12px"><span style="font-family:var(--font-mono);width:180px">--transition-progress</span><span style="width:90px">0.5s ease</span><span style="color:var(--text-muted)">progress-bar fill</span></div><div style="display:flex;gap:12px"><span style="font-family:var(--font-mono);width:180px">--press-scale</span><span style="width:90px">0.98</span><span style="color:var(--text-muted)">buttons shrink on press</span></div>
</div></body></html>
