<!-- @dsCard group="Type" viewport="700x260" name="Type Scale" subtitle="16px base; rem steps from 0.65rem nav labels to 1.5rem title" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--text);}.card-body{padding:18px}a{color:var(--primary)}a:hover{color:var(--primary-hover)}.sw{display:flex;flex-wrap:wrap;gap:10px}.chip{border-radius:10px;border:1px solid var(--border);overflow:hidden;width:150px}.chip .col{height:56px}.chip .meta{padding:6px 8px;font-size:11px;line-height:1.4}.chip .nm{font-weight:700}.chip .hx{color:var(--text-muted);font-family:var(--font-mono);font-size:10px;text-transform:uppercase}</style></head><body><div class="card-body" style="display:flex;flex-direction:column;gap:7px">
<div style="font-size:1.5rem;font-weight:800;letter-spacing:-.5px;color:var(--primary)">1.5rem · Portal title <span style="font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:0">--text-h2 / 800</span></div>
<div style="font-size:1.1rem;font-weight:700">1.1rem · Card header <span style="font-size:11px;font-weight:600;color:var(--text-muted)">--text-card-title / 700</span></div>
<div style="font-size:1rem">1rem · Inputs & buttons <span style="font-size:11px;color:var(--text-muted)">--text-md</span></div>
<div style="font-size:0.9rem;font-weight:600">0.9rem · Form label <span style="font-size:11px;font-weight:400;color:var(--text-muted)">--text-label / 600</span></div>
<div style="font-size:0.85rem">0.85rem · Body <span style="font-size:11px;color:var(--text-muted)">--text-body</span></div>
<div style="font-size:0.75rem;color:var(--text-muted)">0.75rem · Caption / diag table <span style="font-size:11px">--text-sm</span></div>
<div style="font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.3px">0.65rem · NAV LABEL <span style="font-weight:400;text-transform:none;color:var(--text-muted)">--text-2xs / 700 caps</span></div>
</div></body></html>
