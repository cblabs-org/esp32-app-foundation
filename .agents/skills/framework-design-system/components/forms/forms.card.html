<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>html,body{height:100%}body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--text)}.wrap{padding:20px}.grp{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.col{display:flex;flex-direction:column;gap:10px}.lbl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);margin:6px 0 2px;width:100%}a{color:var(--primary)}a:hover{color:var(--primary-hover)}</style></head><body><div class="wrap" id="root"></div>
<script type="text/babel">
const { Button, IconButton, Input, Select, Textarea, ToggleSwitch, PasswordInput } = window.ESP32AppFoundationDesignSystem_aaa6bc;
const Ico = ({d}) => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{d}</svg>;
function Demo(){
  const [on,setOn]=React.useState(true);
  return (<div>
    <div className="lbl">Button variants + states</div>
    <div className="grp">
      <Button>Save & Connect</Button>
      <Button variant="outline">Test Connection</Button>
      <Button variant="secondary">Restart Device</Button>
      <Button variant="danger">Forget Network</Button>
      <Button busy>Scanning…</Button>
      <Button disabled>Disabled</Button>
      <Button variant="secondary" disabled>Disabled</Button>
    </div>
    <div className="grp" style={{marginTop:14}}>
      <span className="lbl" style={{width:'auto',margin:0}}>IconButton</span>
      <IconButton label="Copy"><Ico d={<><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></>}/></IconButton>
      <IconButton label="Refresh"><Ico d={<><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></>}/></IconButton>
      <IconButton label="Delete"><Ico d={<><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></>}/></IconButton>

    <div className="grp" style={{marginTop:18,alignItems:'flex-start'}}>

        <PasswordInput label="Password" placeholder="Network password"/>
        <PasswordInput label="Password (already set)" hasValue/>
      </div>
      <div className="col" style={{maxWidth:280}}>
        <div className="lbl">Select · Toggle · Textarea</div>
        <Select label="Update Channel" options={[{value:'stable',label:'Stable'},{value:'beta',label:'Beta'},{value:'dev',label:'Dev'}]}/>
        <div style={{display:'flex',gap:16,alignItems:'center'}}>
          <ToggleSwitch checked={on} onChange={setOn}/>
          <ToggleSwitch checked={false}/>
          <ToggleSwitch checked disabled/>
        </div>
        <Textarea label="Custom CA" rows={3} placeholder="-----BEGIN CERTIFICATE-----"/>
      </div>
    </div>
