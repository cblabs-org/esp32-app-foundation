<!-- @dsCard group="Spacing" viewport="700x170" name="Corner Radii" subtitle="6px controls → 16px cards → fully round pills & toggles" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--text);}.card-body{padding:18px}a{color:var(--primary)}a:hover{color:var(--primary-hover)}.sw{display:flex;flex-wrap:wrap;gap:10px}.chip{border-radius:10px;border:1px solid var(--border);overflow:hidden;width:150px}.chip .col{height:56px}.chip .meta{padding:6px 8px;font-size:11px;line-height:1.4}.chip .nm{font-weight:700}.chip .hx{color:var(--text-muted);font-family:var(--font-mono);font-size:10px;text-transform:uppercase}</style></head><body><div class="card-body"><div class="sw" style="align-items:flex-end">
<div style="text-align:center;font-size:10px"><div style="width:64px;height:52px;background:var(--primary-alpha);border:1.5px solid var(--primary);border-radius:6px;border-bottom-left-radius:6px;border-bottom-right-radius:6px"></div><div style="font-family:var(--font-mono);margin-top:5px">--radius-sm</div><div style="color:var(--text-muted)">6px</div></div><div style="text-align:center;font-size:10px"><div style="width:64px;height:52px;background:var(--primary-alpha);border:1.5px solid var(--primary);border-radius:8px;border-bottom-left-radius:8px;border-bottom-right-radius:8px"></div><div style="font-family:var(--font-mono);margin-top:5px">--radius-md</div><div style="color:var(--text-muted)">8px</div></div><div style="text-align:center;font-size:10px"><div style="width:64px;height:52px;background:var(--primary-alpha);border:1.5px solid var(--primary);border-radius:10px;border-bottom-left-radius:10px;border-bottom-right-radius:10px"></div><div style="font-family:var(--font-mono);margin-top:5px">--radius-lg</div><div style="color:var(--text-muted)">10px</div></div><div style="text-align:center;font-size:10px"><div style="width:64px;height:52px;background:var(--primary-alpha);border:1.5px solid var(--primary);border-radius:12px;border-bottom-left-radius:12px;border-bottom-right-radius:12px"></div><div style="font-family:var(--font-mono);margin-top:5px">--radius-xl</div><div style="color:var(--text-muted)">12px</div></div><div style="text-align:center;font-size:10px"><div style="width:64px;height:52px;background:var(--primary-alpha);border:1.5px solid var(--primary);border-radius:16px;border-bottom-left-radius:16px;border-bottom-right-radius:16px"></div><div style="font-family:var(--font-mono);margin-top:5px">--radius-2xl</div><div style="color:var(--text-muted)">16px</div></div><div style="text-align:center;font-size:10px"><div style="width:64px;height:52px;background:var(--primary-alpha);border:1.5px solid var(--primary);border-radius:20px;border-bottom-left-radius:20px;border-bottom-right-radius:20px"></div><div style="font-family:var(--font-mono);margin-top:5px">--radius-pill</div><div style="color:var(--text-muted)">20px</div></div><div style="text-align:center;font-size:10px"><div style="width:64px;height:52px;background:var(--primary-alpha);border:1.5px solid var(--primary);border-radius:9999px;border-bottom-left-radius:0;border-bottom-right-radius:0"></div><div style="font-family:var(--font-mono);margin-top:5px">--radius-full</div><div style="color:var(--text-muted)">9999px</div></div>
</div></div></body></html>
