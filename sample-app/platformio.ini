[platformio]
default_envs = esp32dev, esp32s3nano

[env:base]
platform = espressif32
framework = arduino, espidf
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3                 ; ESP-IDF log verbosity: 3 = INFO (0=None, 5=Verbose)
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1    ; Pin async TCP to core 1 to avoid WiFi contention
    -DCONFIG_ASYNC_TCP_STACK_SIZE=4096   ; Stack size for async TCP task
    -DSECURITY_VERSION=1                 ; Anti-rollback security version counter
    -std=gnu++17
    -I include                           ; this app's own generated portal assets (portal_assets/<name>.hpp from web/)
    -I ../include
    -I ../hardware
    -I ../hardware/_common
    -I ../modules                        ; resolve "<Module>/Header.hpp" includes (e.g. U8G2Display/IDisplayBoard.hpp)
    -I ../
build_unflags = -std=gnu++11
lib_ldf_mode = deep+
lib_compat_mode = off
extra_scripts =
    pre:../scripts/sync_sdkconfig.py
    pre:../scripts/inject_version.py
    pre:../scripts/merge_framework_data.py
    pre:../scripts/portalBuilder.py
lib_extra_dirs =
    ../modules
    ../lib
lib_deps =
    Application
    U8G2Display
    ButtonModule
    bblanchon/ArduinoJson@^7.4.3
    hoeken/PsychicHttp@^3.0.0
    olikraus/U8g2@2.36.18


[env:esp32dev]
extends = env:base
board = esp32dev
board_build.partitions = ../hardware/esp32dev/partitions.csv
board_build.filesystem = littlefs
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"
upload_speed = 460800
build_flags =
    ${env:base.build_flags}
    -DBOARD_ID=\"esp32dev\"
    -DBOARD_HEADER=\"../hardware/esp32dev/board.h\"
    -D WITH_DISPLAY_U8G2
    -D WITH_BUTTONS
    -D WITH_MCP
    -D WITH_HOMEASSISTANT
    -DU8G2_WITHOUT_FONT_ROTATION
    -DU8G2_WITHOUT_UNICODE

[env:esp32dev_all_on]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D WITH_OTA
    -D WITH_TIME

[env:esp32dev_all_off]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -UWITH_TIME

[env:esp32s3nano]
extends = env:base
board = um_nanos3
board_build.partitions = ../hardware/esp32s3nano/partitions.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;../hardware/esp32s3nano/sdkconfig.defaults"
build_flags =
    ${env:base.build_flags}
    -DBOARD_ID=\"esp32s3nano\"
    -DBOARD_HEADER=\"../hardware/esp32s3nano/board.h\"
    -DBOARD_HAS_PSRAM
    -D WITH_DISPLAY_U8G2
    -D WITH_BUTTONS
    -D WITH_MCP
    -D WITH_HOMEASSISTANT
    -DU8G2_WITHOUT_FONT_ROTATION
    -DU8G2_WITHOUT_UNICODE

[ble]
build_flags = -D WITH_BLE
lib_deps =
    h2zero/esp-nimble-cpp@^2.1.0
    BLEManager

[env:esp32s3nano_ble]
extends = env:esp32s3nano
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;../hardware/esp32s3nano/sdkconfig.defaults;../hardware/_common/sdkconfig.ble.defaults"
build_flags =
    ${env:esp32s3nano.build_flags}
    ${ble.build_flags}
lib_deps =
    ${env:esp32s3nano.lib_deps}
    ${ble.lib_deps}

[env:native]
platform = native
lib_compat_mode = off
lib_ldf_mode = deep+
build_flags =
    -std=c++17
    -DUNIT_TEST
    -I include                           ; this app's own generated portal assets (built by esp32dev/s3nano builds)
    -I ../include
    -I ../hardware
    -I ../hardware/_common
    -I ../
    -I ../test/stubs/platform
    -DBUILD_VERSION=\"0.0.0-native\"
    -DVERSION_MAJOR=0
    -DVERSION_MINOR=0
    -DVERSION_PATCH=0
    -DVERSION_CHANNEL=3
    -DVERSION_PRE_NUM=0
    -DBOARD_ID=\"native\"
    -DBOARD_HEADER=\"../hardware/native/board.h\"
    -DSECURITY_VERSION=1
lib_extra_dirs =
    ../modules
    ../lib
lib_deps =
    google/googletest@^1.15.2
    bblanchon/ArduinoJson@^7.4.3
    Application
test_framework = googletest
; Exclude test_weather: WeatherModule.hpp pulls in AppFoundation.h → board.h →
; NativeU8G2DisplayType.h → U8g2lib.h, which is not in sample-app lib_deps.
; Re-enable once a minimal U8g2 stub is available for consumer native builds.
;
; BOTH lines are required. PlatformIO discovers every directory whose basename
; starts with "test_", which includes the PARENT "test_unit" directory as a
; suite in its own right. test_filter restricts discovery to the leaf suites;
; test_ignore then drops the broken one. With test_ignore alone, "test_unit"
; still runs and its recursive src filter (+<test_unit/>) compiles
; test_weather/ anyway — reintroducing the U8g2lib.h build failure.
test_filter = test_unit/*
test_ignore = test_unit/test_weather
; Exclude display-related files from native builds (U8g2lib.h unavailable)
build_src_filter = +<*> -<WeatherBoard.cpp> -<WeatherWidget.cpp>
