[platformio]
default_envs = esp32dev, esp32s3nano

[env:base]
platform = espressif32
framework = arduino, espidf
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3                 ; ESP-IDF log verbosity: 3 = INFO (0=None, 5=Verbose)
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1    ; Pin async TCP to core 1 to avoid WiFi contention
    -DCONFIG_ASYNC_TCP_STACK_SIZE=4096   ; Stack size for async TCP task
    -DAPP_TITLE=\"ESP32\ App\ Foundation\" ; Application title shown in portal header
    -DSECURITY_VERSION=1                 ; Anti-rollback security version counter
    -std=gnu++17
    -I ../include
build_unflags = -std=gnu++11
lib_ldf_mode = deep+
lib_compat_mode = strict
extra_scripts =
    pre:../scripts/sync_sdkconfig.py
    pre:../scripts/inject_version.py
    pre:../scripts/merge_framework_data.py
    pre:../scripts/portalBuilder.py
lib_extra_dirs = 
    ../modules
    ../lib
lib_deps =
    Application
    bblanchon/ArduinoJson@7.4.3
    hoeken/PsychicHttp@3.0.0
    olikraus/U8g2@2.36.18
    squix78/JsonStreamingParser@^1.0.5


[env:esp32dev]
extends = env:base
board = esp32dev
board_build.partitions = ../partitions.esp32dev.csv
board_build.filesystem = littlefs
custom_sdkconfig = sdkconfig.defaults
upload_speed = 460800
build_flags =
    ${env:base.build_flags}
    -DBOARD_ID=\"esp32dev\"
    -DU8G2_DISPLAY_TYPE=U8G2_SSD1322_NHD_256X64_F_4W_HW_SPI
    -DU8G2_WITHOUT_FONT_ROTATION
    -DU8G2_WITHOUT_UNICODE
    -DDISPLAY_CS_PIN=26
    -DDISPLAY_DC_PIN=5
    -DDISPLAY_SPI_SCK=18
    -DDISPLAY_SPI_MISO=19
    -DDISPLAY_SPI_MOSI=23

[env:esp32s3nano]
extends = env:base
board = um_nanos3
board_build.partitions = ../partitions.esp32s3nano.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3nano"
build_flags =
    ${env:base.build_flags}
    -DBOARD_ID=\"esp32s3nano\"
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DU8G2_DISPLAY_TYPE=U8G2_SSD1322_NHD_256X64_F_4W_HW_SPI
    -DU8G2_WITHOUT_FONT_ROTATION
    -DU8G2_WITHOUT_UNICODE
    -DDISPLAY_CS_PIN=10
    -DDISPLAY_DC_PIN=9
    -DDISPLAY_SPI_SCK=48
    -DDISPLAY_SPI_MISO=47
    -DDISPLAY_SPI_MOSI=38

[env:native]
platform = native
lib_compat_mode = off
lib_ldf_mode = deep+
build_flags =
    -std=c++17
    -DNATIVE_BUILD
    -DUNIT_TEST
    -I ../include
    -I ../
    -DBUILD_VERSION=\"0.0.0-native\"
    -DVERSION_MAJOR=0
    -DVERSION_MINOR=0
    -DVERSION_PATCH=0
    -DVERSION_CHANNEL=3
    -DVERSION_PRE_NUM=0
    -DBOARD_ID=\"native\"
    -DAPP_TITLE=\"Weather\ Station\"
    -DSECURITY_VERSION=1
lib_extra_dirs =
    ../modules
    ../lib
lib_deps =
    google/googletest@^1.15.2
    bblanchon/ArduinoJson@7.4.3
    Application
test_framework = googletest
test_filter = test_unit/*
; Exclude display-related files from native builds (U8g2lib.h unavailable)
build_src_filter = +<*> -<WeatherBoard.cpp> -<WeatherWidget.cpp>




